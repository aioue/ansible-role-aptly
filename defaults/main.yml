---
aptly_gpg_key_dir: "aptly"
aptly_key_email: foo@bar.com
aptly_company_name: yourcompany
aptly_repositories:
- name: "{{ aptly_company_name }}-dev"
  comment: development packages
  default_distribution: noble  # Ubuntu 24.04 LTS - current supported version
  default_component: main
- name: "{{ aptly_company_name }}-test"
  comment: test packages
  default_distribution: noble  # Ubuntu 24.04 LTS - current supported version
  default_component: main
